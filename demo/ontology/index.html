<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>ATLAS Ontology Explorer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23171717'/%3E%3Crect x='11.5' y='51' width='41' height='4' fill='%2336E0AD'/%3E%3Ctext x='32' y='40' font-family='Helvetica,sans-serif' font-weight='700' font-size='38' fill='white' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<script>
// Same theme logic as the ATLAS Agent Organization: stored choice, else the system setting, default dark.
(function () { var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
  var dark = t === "dark" || (t !== "light" && !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.classList.toggle("dark", dark); document.documentElement.style.colorScheme = dark ? "dark" : "light"; })();
</script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap");
/* Design tokens copied from the running ATLAS Agent Organization (shadcn-style names), light first, dark under html.dark. */
:root {
  --font-sans: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 0.5rem;
  --background: oklch(1 0 0); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0);
  --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0); --accent: oklch(0.97 0 0);
  --border: oklch(0.922 0 0); --input: oklch(0.922 0 0);
  --primary: rgb(0, 35, 75); --primary-foreground: #fff; --ring: rgb(0, 160, 227);
  --sidebar: #f2f2f2; --sidebar-foreground: oklch(0.145 0 0); --sel: rgb(11, 58, 107);
  --d-marketing: #8E5CD9; --d-care: #E0648A; --d-operations: #F0A030; --d-billing: #2FA67A; --d-network: #2E86D6; --d-governance: #6B7A8C; --d-executive: #171717;
}
html.dark {
  --background: oklch(0.205 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0);
  --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0); --accent: oklch(0.269 0 0);
  --border: oklch(1 0 0 / 0.1); --input: oklch(1 0 0 / 0.15);
  --primary: rgb(0, 160, 227); --primary-foreground: rgb(0, 23, 47);
  --sidebar: oklch(0.269 0 0); --sidebar-foreground: oklch(0.985 0 0);
}
:root { --edge: color-mix(in oklab, var(--muted-foreground) 55%, transparent); --edge-hot: var(--ring); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); font-size: 14px; background: var(--background); color: var(--foreground); }
.app { display: flex; height: 100vh; }
/* sidebar: 240 px, same nav item metrics as the Agent Organization */
.sb { width: 240px; flex: none; background: var(--sidebar); color: var(--sidebar-foreground); display: flex; flex-direction: column; padding: 12px; gap: 4px; overflow: auto; }
.sb-head { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.sb-head svg { width: 26px; height: 26px; flex: none; }
.sb-head b { font-size: 14px; font-weight: 600; display: block; line-height: 1.2; }
.sb-head span { font-size: 11px; color: var(--muted-foreground); }
.sb-label { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: color-mix(in oklab, var(--muted-foreground) 60%, transparent); padding: 14px 8px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 6px 8px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; color: color-mix(in oklab, var(--sidebar-foreground) 80%, transparent); background: transparent; border: 0; text-decoration: none; cursor: pointer; text-align: left; }
.nav svg { width: 16px; height: 16px; flex: none; }
.nav:hover { background: color-mix(in oklab, var(--sidebar-foreground) 8%, transparent); }
.nav[aria-pressed="true"] { background: var(--sel); color: #fff; }
.nav:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
.sb-foot { margin-top: auto; padding-top: 10px; }
.mainc { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: auto; }
.topbar { height: 60px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-bottom: 1px solid var(--border); }
.topbar h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; }
.search { margin-left: auto; }
.search input { font: inherit; font-size: 13px; height: 36px; padding: 0 12px; border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--input); background: transparent; color: var(--foreground); width: 280px; }
.search input::placeholder { color: var(--muted-foreground); }
.search input:focus { outline: 2px solid var(--ring); outline-offset: 0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 24px 0; align-items: center; }
.filters .lbl { font-size: 10px; letter-spacing: 1px; color: var(--muted-foreground); margin-right: 6px; text-transform: uppercase; }
.chip { font: inherit; font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--foreground); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.chip:hover { background: var(--muted); }
.chip[aria-pressed="true"] { background: var(--muted); border-color: color-mix(in oklab, var(--foreground) 25%, transparent); }
.chip:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 14px 24px 16px; flex: 1; min-height: 0; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
@media (max-width: 860px) { .app { flex-direction: column; height: auto; } .sb { width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; } .sb-label { display: none; } .nav { width: auto; } .sb-foot { margin: 0 0 0 auto; padding: 0; } }
.map, .panel, .graphwrap { background: var(--card); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.5); }
.map { padding: 8px; overflow: auto; }
.colhead { font-size: 10px; fill: var(--muted-foreground); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
.node { cursor: pointer; }
.node rect.pill { fill: var(--muted); stroke: var(--border); }
.node text { font-family: var(--font-sans); font-size: 11.5px; font-weight: 500; fill: var(--foreground); pointer-events: none; }
.node:focus-visible rect.pill, .node:hover rect.pill { stroke: var(--ring); stroke-width: 1.5; }
.node.sel rect.pill { fill: var(--sel); stroke: var(--ring); stroke-width: 2; }
.node.sel text { fill: #fff; }
.node.dim { opacity: .22; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1; opacity: .55; }
.edge.hot { stroke: var(--edge-hot); stroke-width: 2; opacity: 1; }
.edge.dim { opacity: .08; }
.panel { padding: 18px; align-self: start; position: sticky; top: 0; max-height: calc(100vh - 235px); overflow: auto; }
.panel h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
.panel .sub { font-size: 12px; color: var(--muted-foreground); margin-bottom: 14px; }
.panel h3 { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-foreground); margin: 18px 0 8px; }
.panel p { line-height: 1.55; }
.layer { border-left: 2px solid var(--ring); padding: 2px 0 2px 12px; margin: 8px 0; font-size: 13px; line-height: 1.5; }
.layer b { display: block; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-foreground); margin-bottom: 2px; }
.layer code, .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 11.5px; }
.pill-list { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: inherit; font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--muted); border: 1px solid var(--border); color: var(--foreground); text-decoration: none; cursor: pointer; }
a.tag:hover, button.tag:hover { border-color: var(--ring); }
.cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.status { font-size: 10.5px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.status.atlas-api { background: color-mix(in oklab, #2FA67A 22%, transparent); color: #2FA67A; }
.status.awaiting-api { background: color-mix(in oklab, #F0A030 22%, transparent); color: #F0A030; }
.empty { color: var(--muted-foreground); font-size: 13px; line-height: 1.6; }
.warn { margin: 8px 24px 0; padding: 8px 12px; border-radius: 8px; background: color-mix(in oklab, #F0A030 20%, transparent); color: var(--foreground); font-size: 12px; display: none; }
.graphwrap { position: relative; overflow: hidden; display: none; height: calc(100vh - 235px); min-height: 440px; }
body.view-graph .graphwrap { display: block; }
body.view-graph .map { display: none; }
#gcanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#gcanvas.grabbing { cursor: grabbing; }
.gctl { position: absolute; left: 12px; top: 12px; max-height: calc(100% - 24px); overflow: auto; background: color-mix(in oklab, var(--card) 92%, transparent); border: 1px solid var(--border); border-radius: calc(var(--radius) * 1.25); padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 5px; max-width: 220px; }
.gctl h4 { margin: 0 0 2px; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-foreground); }
.gctl label { display: flex; align-items: center; gap: 7px; cursor: pointer; font-weight: 500; }
.gctl label i { width: 10px; height: 10px; display: inline-block; border-radius: 50%; }
.gctl .row { display: flex; gap: 6px; margin-top: 4px; }
.gctl button { font: inherit; font-size: 11.5px; font-weight: 500; padding: 5px 10px; border-radius: calc(var(--radius) * 0.8); border: 1px solid var(--input); background: transparent; color: var(--foreground); cursor: pointer; }
.gctl button:hover { background: var(--muted); }
.gctl-head { all: unset; cursor: pointer; font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; color: var(--muted-foreground); }
.gctl.collapsed > :not(.gctl-head) { display: none; }
.ghint { position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: var(--muted-foreground); }
footer { padding: 4px 24px 16px; font-size: 11px; color: var(--muted-foreground); }
</style>
</head>
<body class="view-graph">
<div class="app">
  <aside class="sb">
    <div class="sb-head">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="13" fill="#171717" stroke="#12406F"/><rect x="11.5" y="51" width="41" height="4" fill="#36E0AD"/><text x="32" y="40" font-family="Montserrat,Helvetica,sans-serif" font-weight="700" font-size="38" fill="#fff" text-anchor="middle">A</text></svg>
      <div><b>Ontology</b><span id="subtitle">ATLAS AI Labs</span></div>
    </div>
    <div class="sb-label">View</div>
    <button class="nav" type="button" id="tab-graph" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 7.5l3 8M16 7.5l-3 8M8.5 6h7"/></svg>Graph</button>
    <button class="nav" type="button" id="tab-map" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="6" height="6" rx="1"/><rect x="15" y="4" width="6" height="6" rx="1"/><rect x="9" y="14" width="6" height="6" rx="1"/><path d="M9 7h6M6 10v2.5h6M18 10v2.5h-6"/></svg>Map</button>
    <div id="atlas-platform" data-current="ontology"></div>
    <div class="sb-foot"><button class="nav" type="button" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="theme-label">Light mode</span></button></div>
  </aside>
  <div class="mainc">
    <div class="topbar"><h1>Ontology</h1><div class="search"><input id="q" type="search" placeholder="Search a term, API, process, view or agent" aria-label="Search the ontology" autocomplete="off"></div></div>
    <div class="warn" id="warn" role="alert"></div>
    <div class="filters" id="filters" role="group" aria-label="Filter by department"><span class="lbl">Department</span></div>
    <main>
      <section class="map"><svg id="svg" role="img" aria-label="Map of workflows, ontology terms and agents"></svg></section>
      <section class="graphwrap" id="graphwrap"><canvas id="gcanvas" aria-label="Animated relationship graph of departments, ontology terms, agents, workflows, TMF APIs, BSS domains and capabilities"></canvas><div class="gctl" id="gctl"></div><div class="ghint">Drag a node · scroll to zoom · drag the background to pan · click to open</div></section>
      <aside class="panel" id="panel" aria-live="polite"></aside>
    </main>
    <footer id="foot"></footer>
  </div>
</div>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
let DEPTS = ["Marketing", "Care", "Operations", "Billing", "Network", "Governance", "Executive"];
// Another industry (P0-33) brings its own departments; they take the same seven colours in order.
const PAL = ["marketing", "care", "operations", "billing", "network", "governance", "executive"];
const dcol = (d) => { const i = DEPTS.indexOf(d); return `var(--d-${PAL[i >= 0 ? i % PAL.length : 6]})`; };
const INDUSTRY = new URLSearchParams(location.search).get("industry");
const STD = () => D?.standard ?? "TMF Open API";
const el = (tag, attrs = {}, text) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; return n; };
const h = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const k in attrs) { if (k === "class") n.className = attrs[k]; else if (k === "text") n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); } kids.flat().forEach(c => c != null && n.append(c.nodeType ? c : document.createTextNode(c))); return n; };

let D, sel = null, deptOn = new Set(DEPTS), query = "";
const W = 800, ROW = 25, TOP = 56, GAP = 10;
const colX = { wf: 12, term: 240, agent: 510 }, colW = { wf: 190, term: 200, agent: 280 };
const pos = {};

function industrySwitcher() {
  fetch("/data/industries.json").then((r) => r.json()).then((list) => {
    const s = h("select", { "aria-label": "Industry", style: "margin:2px 8px 6px;font:inherit;font-size:13px;height:32px;border-radius:8px;border:1px solid var(--input);background:transparent;color:inherit;padding:0 8px" });
    for (const x of list) { const o = h("option", { value: x.id, text: `${x.label} · ${x.operator}` }); if ((INDUSTRY ?? "telco") === x.id) o.selected = true; s.append(o); }
    s.onchange = () => { location.href = s.value === "telco" ? "/" : `/?industry=${s.value}`; };
    const view = [...document.querySelectorAll(".sb-label")].find((l) => l.textContent === "View");
    view.before(h("div", { class: "sb-label", text: "Industry" }), s);
  }).catch(() => {});
}
async function boot() {
  const res = await fetch("/data/ontology.json" + (INDUSTRY ? `?industry=${encodeURIComponent(INDUSTRY)}` : ""), { cache: "no-store" });
  D = await res.json();
  if (D.departments) { DEPTS = D.departments; deptOn = new Set(DEPTS); }
  if (D.standard) KINDS.tmf.label = D.standard;
  industrySwitcher();
  const nGen = D.terms.filter(isGen).length;
  document.getElementById("subtitle").textContent = `${D.operator} · ${D.terms.length - nGen} terms` + (nGen ? ` + ${nGen} general concepts` : "") + (D.industry ? ` · ${D.agents.length} agents` : "") + (D.pack ? ` + ${D.pack.nodes.length} generic pack nodes` : "");
  if (D.industry) document.getElementById("foot").textContent = `${D.operator} (${D.industryLabel}). ${D.source} Same Explorer, same agent organization model: a different ontology gives a different organization.`;
  else document.getElementById("foot").textContent = "Glossary view of the ATLAS AI Labs ontology: TMF Open API concepts, the Generic capability mapping and ATLAS AI Labs' own wording. Agents come from the agent organization; capability status shows whether a BSS API exists yet. This map shows the ATLAS AI Labs terms; the Graph also shows the general telco concepts and how they relate.";
  if (D.validationErrors?.length) { const w = document.getElementById("warn"); w.style.display = "block"; w.textContent = "Ontology check: " + D.validationErrors.join("; "); }
  const f = document.getElementById("filters");
  for (const d of DEPTS.slice(0, 6)) {
    const b = h("button", { class: "chip", type: "button", "aria-pressed": "true" }, h("i", { style: `background:${dcol(d)}` }), d);
    b.onclick = () => { if (deptOn.has(d)) deptOn.delete(d); else deptOn.add(d); b.setAttribute("aria-pressed", deptOn.has(d)); draw(); };
    f.append(b);
  }
  document.getElementById("q").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); draw(); });
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) sel = hash;
  draw();
}

const isGen = (t) => t.layer === "general";
const termMatches = (t) => !query || [t.id, t.nordwave.label, ...t.nordwave.synonyms, t.tmf.api ?? "", t.tmf.concept ?? "", t.atlas?.term ?? "", t.telco?.why ?? ""].some(s => s.toLowerCase().includes(query));
const termVisible = (t) => deptOn.has(t.department) && termMatches(t);

function draw() {
  if (document.body.classList.contains("view-graph")) { G.alpha = Math.max(G.alpha, 0.35); panel(); return; }
  const svg = document.getElementById("svg"); svg.replaceChildren();
  const order = (a, b) => DEPTS.indexOf(a.department) - DEPTS.indexOf(b.department);
  const terms = D.terms.filter(t => !isGen(t)).sort(order);
  const used = new Set(terms.flatMap(t => t.agents));
  const agents = D.agents.filter(a => used.has(a.key)).sort(order);
  // vertical placement with a small gap between departments
  let y = TOP, last = null;
  for (const t of terms) { if (last && last !== t.department) y += GAP; last = t.department; pos["t:" + t.id] = y; y += ROW; }
  const termsEnd = y; y = TOP; last = null;
  for (const a of agents) { if (last && last !== a.department) y += GAP; last = a.department; pos["a:" + a.key] = y; y += ROW; }
  const H = Math.max(termsEnd, y) + 16;
  const wfStart = TOP + 40;
  D.workflows.forEach((w, i) => { pos["w:" + w.id] = wfStart + i * 60; });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", "100%"); svg.style.minWidth = "680px";

  svg.append(el("text", { class: "colhead", x: colX.wf, y: 30 }, "Workflows (Agent Builder)"), el("text", { class: "colhead", x: colX.term, y: 30 }, "Ontology terms"), el("text", { class: "colhead", x: colX.agent, y: 30 }, "Agents (Agent Organization)"));

  const focus = focusSet();
  const edges = el("g"), nodes = el("g"); svg.append(edges, nodes);
  const curve = (x1, y1, x2, y2) => `M${x1},${y1} C${x1 + (x2 - x1) / 2},${y1} ${x1 + (x2 - x1) / 2},${y2} ${x2},${y2}`;
  const pill = (key, x, w, label, cls, color, onclick, visible) => {
    const g = el("g", { class: `node ${cls}${sel === key ? " sel" : ""}${visible ? "" : " dim"}`, tabindex: 0, role: "button", "aria-label": label, transform: `translate(${x},${pos[key] - 15})` });
    g.append(el("rect", { class: "pill", width: w, height: 21, rx: 10.5 }), el("circle", { cx: 11, cy: 10.5, r: 4, fill: color }), el("text", { x: 22, y: 14.5 }, label.length > 36 ? label.slice(0, 35) + "…" : label));
    g.onclick = onclick; g.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onclick(); } };
    nodes.append(g);
  };
  // edges
  for (const w of D.workflows) for (const id of w.terms) {
    if (pos["t:" + id] === undefined) continue;   // general telco concepts are not rows in the map
    const t = D.terms.find(x => x.id === id);
    const hot = focus && focus.has("w:" + w.id) && focus.has("t:" + id);
    edges.append(el("path", { class: `edge${hot ? " hot" : ""}${focus && !hot ? " dim" : ""}${!focus && !termVisible(t) ? " dim" : ""}`, d: curve(colX.wf + colW.wf, pos["w:" + w.id] - 4, colX.term, pos["t:" + id] - 4) }));
  }
  for (const t of terms) for (const k of t.agents) {
    const hot = focus && focus.has("t:" + t.id) && focus.has("a:" + k);
    edges.append(el("path", { class: `edge${hot ? " hot" : ""}${focus && !hot ? " dim" : ""}${!focus && !termVisible(t) ? " dim" : ""}`, d: curve(colX.term + colW.term, pos["t:" + t.id] - 4, colX.agent, pos["a:" + k] - 4) }));
  }
  // nodes
  for (const w of D.workflows) pill("w:" + w.id, colX.wf, colW.wf, w.name, "wf", "var(--ring)", () => choose("w:" + w.id), !focus || focus.has("w:" + w.id));
  for (const t of terms) pill("t:" + t.id, colX.term, colW.term, t.nordwave.label, "term", dcol(t.department), () => choose("t:" + t.id), (!focus || focus.has("t:" + t.id)) && termVisible(t));
  for (const a of agents) pill("a:" + a.key, colX.agent, colW.agent, a.name, "agent", dcol(a.department), () => choose("a:" + a.key), (!focus || focus.has("a:" + a.key)) && a.key && D.terms.some(t => t.agents.includes(a.key) && termVisible(t)));
  panel();
}

function focusSet() {
  if (!sel) return null;
