  var dark = t === "dark" || (t !== "light" && !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.classList.toggle("dark", dark); document.documentElement.style.colorScheme = dark ? "dark" : "light"; })();

<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap");
:root {
  --font-sans: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --radius: 0.5rem;
  --background: oklch(1 0 0); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0); --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
  --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --primary: rgb(0, 35, 75); --ring: rgb(0, 160, 227);
  --sidebar: #f2f2f2; --sel: rgb(11, 58, 107);
  --ok: #2FA67A; --bad: #E0648A; --warn: #F0A030; --info: #2E86D6;
}
html.dark { --background: oklch(0.205 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
  --border: oklch(1 0 0 / 0.1); --input: oklch(1 0 0 / 0.15); --primary: rgb(0, 160, 227); --sidebar: oklch(0.269 0 0); }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); font-size: 14px; background: var(--background); color: var(--foreground); }
.app { display: flex; height: 100vh; }
.sb { width: 240px; flex: none; background: var(--sidebar); display: flex; flex-direction: column; padding: 12px; gap: 4px; overflow: auto; }
.sb-head { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; } .sb-head svg { width: 26px; height: 26px; flex: none; }
.sb-head b { font-size: 14px; font-weight: 600; display: block; line-height: 1.2; } .sb-head span { font-size: 11px; color: var(--muted-foreground); }
.sb-label { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: color-mix(in oklab, var(--muted-foreground) 60%, transparent); padding: 14px 8px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 6px 8px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; text-align: left; }
.nav:hover { background: color-mix(in oklab, currentColor 8%, transparent); } .nav[aria-current] { background: var(--sel); color: #fff; }
.nav svg { width: 16px; height: 16px; flex: none; } .nav .cnt { margin-left: auto; font-size: 11px; opacity: .7; } .sb-foot { margin-top: auto; padding-top: 10px; }
.mainc { flex: 1; min-width: 0; overflow: auto; }
.topbar { height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--background); z-index: 2; }
.topbar h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: .6px; text-transform: uppercase; }
.topbar .sub { color: var(--muted-foreground); font-size: 12px; margin-left: auto; display: flex; align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok) 25%, transparent); }
.wrap { padding: 18px 24px 40px; max-width: 1240px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--card); overflow-x: auto; }
.kpi .l { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted-foreground); } .kpi .v { font-size: 24px; font-weight: 600; margin-top: 6px; } .kpi .n { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; }
.tabs2 { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin: 0 0 14px; } .tabs2 a { padding: 8px 14px; font-size: 13px; font-weight: 500; color: inherit; text-decoration: none; border-bottom: 2px solid transparent; } .tabs2 a[aria-current] { border-color: var(--ring); color: var(--ring); }
.tabs2 a .cnt { font-size: 11px; color: var(--muted-foreground); margin-left: 4px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
input[type=search], select { font: inherit; font-size: 13px; height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--input); background: transparent; color: inherit; } input[type=search] { min-width: 240px; }
select option { background: var(--background); color: var(--foreground); }
.btn { font: inherit; font-size: 12px; font-weight: 500; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--input); background: transparent; color: inherit; cursor: pointer; } .btn[aria-pressed="true"] { background: var(--sel); color: #fff; border-color: transparent; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; letter-spacing: .3px; } h3 { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted-foreground); margin: 18px 0 8px; font-weight: 500; }
.muted { color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }

.badge.warn { background: color-mix(in oklab, var(--warn) 24%, transparent); color: var(--warn); } .badge.info { background: color-mix(in oklab, var(--ring) 20%, transparent); color: var(--ring); }

.offer { border: 1px solid var(--border); border-radius: 10px; padding: 14px; background: var(--card); cursor: pointer; display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: inherit; position: relative; transition: border-color .15s; }
.offer:hover { border-color: var(--ring); } .offer.dim { opacity: .55; } .offer.fresh { animation: glow 2.4s ease-out 2; }
@keyframes glow { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ring) 70%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

.offer .nm { font-size: 13px; font-weight: 600; padding-right: 36px; overflow-wrap: anywhere; } .offer .id { font-size: 11px; color: var(--muted-foreground); }
.offer .price { font-size: 22px; font-weight: 600; } .offer .price small { font-size: 12px; font-weight: 500; color: var(--muted-foreground); }
.offer .allow { display: flex; gap: 10px; font-size: 12px; color: var(--muted-foreground); flex-wrap: wrap; } .offer .allow b { color: var(--foreground); font-weight: 600; }
.offer .foot { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted-foreground); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; } th, td { text-align: left; padding: 8px; border-top: 1px solid var(--border); vertical-align: top; }

.kv { display: grid; grid-template-columns: 170px 1fr; gap: 7px 12px; font-size: 13px; margin: 0; } .kv dt { color: var(--muted-foreground); } .kv dd { margin: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; } @media (max-width: 980px) { .cols { grid-template-columns: 1fr; } .sb { display: none; } }

.empty { border: 1px dashed var(--border); border-radius: var(--radius); padding: 28px; line-height: 1.7; color: var(--muted-foreground); }
.toast { position: fixed; right: 20px; bottom: 20px; background: var(--sel); color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,.3); opacity: 0; transform: translateY(8px); transition: all .25s; pointer-events: none; z-index: 5; } .toast.on { opacity: 1; transform: none; }

</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-head">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="13" fill="#171717"/><circle cx="32" cy="32" r="13" fill="none" stroke="#36E0AD" stroke-width="6"/></svg>

    <div class="sb-foot"><button class="nav" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="theme-label">Light mode</span></button></div>
  </aside>

  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script type="module">
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else if (v !== false && v != null) n.setAttribute(k, v); } for (const c of kids.flat(Infinity)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c))); return n; };
const eur = (s) => `EUR ${s}`;
const num = (x) => Math.round(x).toLocaleString("en-US");
const root = document.getElementById("root"), titleEl = document.getElementById("title");
const badge = (t, k = "") => el("span", { class: `badge ${k}` }, t);
const td = (v, cls = "") => el("td", { class: cls }, v);
const table = (heads, rows, numCols = []) => el("table", {}, el("thead", {}, el("tr", {}, heads.map((h, i) => el("th", { class: numCols.includes(i) ? "num" : "" }, h)))), el("tbody", {}, rows));

const kv = (pairs) => el("dl", { class: "kv" }, pairs.filter(Boolean).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v ?? "—")]));
const SEG = { consumer: "Consumer", youth: "Youth", family: "Family", sme: "SME" }, PAY = { prepaid: "Prepaid", postpaid: "Postpaid" };
const LIFE = { active: ["Active", "good"], draft: ["Draft", "info"], retired: ["Retired", ""] };
const VERD = { PASS: "good", FIX: "warn", BLOCK: "bad" };
const AGENT = { "competitor-supervisor": "Competitor Supervisor", "product-configurator": "Product Configurator (B2C)", "catalog-governor": "Catalog Governor" };
const who = (k) => AGENT[k] ?? k;
const brk = (n) => n.replaceAll("_", "_\u200b");   // lets long ATLAS_ names wrap at the underscores
const pretty = (n) => n.replace(/^ATLAS_/, "").replaceAll("_", " ");
const life = (o) => badge(...LIFE[o.lifecycle]);

let data = null, seen = null, fresh = new Set(), view = "cards";
try { view = localStorage.getItem("catalogue-view") ?? "cards"; } catch {}

function route() { const h = location.hash.replace(/^#\/?/, ""), [p, qs] = h.split("?"); return { parts: p.split("/").filter(Boolean), q: new URLSearchParams(qs ?? "") }; }
function setNav(name) { for (const n of ["offers", "drafts", "addons", "scans", "releases"]) { const a = document.getElementById("n-" + n); if (n === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); } }
function toast(t) { const n = document.getElementById("toast"); n.textContent = t; n.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => n.classList.remove("on"), 4500); }

async function load() {
  const r = await fetch("/twin/api/catalogue/view", { cache: "no-store" }); if (!r.ok) throw new Error("catalogue " + r.status);
  const d = await r.json(), ids = new Set(d.offers.map((o) => o.id));
  if (seen) for (const o of d.offers) if (!seen.has(o.id)) { fresh.add(o.id); toast(`New ${o.lifecycle} ${o.id} ${o.name}${o.created_by ? ` from ${who(o.created_by)}` : ""}`); }
  const changed = !data || JSON.stringify(d) !== JSON.stringify(data);
  seen = ids; data = d; return changed;
}

function counts() {
  const s = data.summary;
  document.getElementById("c-offers").textContent = s.active + s.retired;
  document.getElementById("c-drafts").textContent = s.drafts;
  document.getElementById("c-addons").textContent = s.addons;
  document.getElementById("c-scans").textContent = data.scans.length;
  document.getElementById("c-releases").textContent = data.releases.length;
  document.getElementById("asof").textContent = `Live · ${data.offers.length} offerings · as of ${data.as_of}`;
}

function kpis() {
  const s = data.summary, k = (l, v, n, href) => el(href ? "a" : "div", { class: "card kpi", href, style: href ? "text-decoration:none;color:inherit" : null }, el("div", { class: "l" }, l), el("div", { class: "v" }, v), el("div", { class: "n" }, n));
  const waiting = data.offers.filter((o) => o.lifecycle === "draft" && !o.release_ticket).length;
  return el("div", { class: "kpis" },
    k("Active offerings", num(s.active), `${s.retired} retired or end-dated`, "#/offers"),
    k("Drafts", num(s.drafts), `${waiting} waiting for approval`, "#/drafts"),
    k("Add-ons", num(s.addons), "attachable to plans", "#/addons"),
    k("Subscribers", num(s.subscribers), "on active offerings"),
    k("Monthly recurring revenue", `EUR ${(s.mrr_cents / 1e8).toFixed(2)}M`, `${eur((s.mrr_cents / 100).toLocaleString("en-US", { minimumFractionDigits: 2 }))}, price × subscribers`));
}

function offerCard(o) {
  return el("a", { class: `offer${o.lifecycle === "retired" ? " dim" : ""}${fresh.has(o.id) ? " fresh" : ""}`, href: `#/offer/${o.id}` },
    el("span", { class: "tech" }, o.technology),
    el("div", {}, el("div", { class: "nm" }, brk(o.name)), el("div", { class: "id" }, `${o.id} · ${pretty(o.name)}`)),
    el("div", { class: "price" }, o.price ? eur(o.price) : "no price", " ", el("small", {}, `/${o.validity ?? "?"}`)),
    el("div", { class: "allow" }, el("span", {}, el("b", {}, o.data), " data"), el("span", {}, el("b", {}, o.minutes), " min"), el("span", {}, el("b", {}, o.sms), " SMS")),
    o.addons.length ? el("div", { class: "muted" }, "+ ", o.addons.map((a) => pretty(a.name)).join(", ")) : null,
    el("div", { class: "foot" }, el("span", {}, life(o), " ", o.lifecycle === "draft" ? badge(o.verdict, VERD[o.verdict]) : null, o.agent_created ? badge("agent", "info") : null),
      el("span", {}, o.lifecycle === "draft" ? "awaiting approval" : `${num(o.subscribers)} subs`)));
}

function offersPage(q) {
  setNav("offers"); titleEl.textContent = "Product catalogue";
  const f = { q: q.get("q") ?? "", segment: q.get("segment") ?? "", payment: q.get("payment") ?? "", tech: q.get("tech") ?? "", life: q.get("life") ?? "live" };
  const go = (patch) => { const n = new URLSearchParams({ ...f, ...patch }); for (const [k, v] of [...n]) if (!v) n.delete(k); location.hash = `#/offers?${n}`; };
  const sel = (key, opts) => el("select", { "aria-label": key, onchange: (e) => go({ [key]: e.target.value }) }, opts.map(([v, l]) => el("option", { value: v, selected: f[key] === v ? "" : null }, l)));
  const search = el("input", { type: "search", placeholder: "Search name or id", value: f.q, onkeydown: (e) => { if (e.key === "Enter") go({ q: e.target.value }); } });
  const list = data.offers.filter((o) => (!f.q || (o.name + o.id).toLowerCase().includes(f.q.toLowerCase())) && (!f.segment || o.segment === f.segment) && (!f.payment || o.payment === f.payment) && (!f.tech || o.technology === f.tech)
    && (f.life === "all" || (f.life === "live" ? o.lifecycle !== "retired" : o.lifecycle === f.life)));
  const vbtn = (v, l) => el("button", { class: "btn", "aria-pressed": String(view === v), onclick: () => { view = v; try { localStorage.setItem("catalogue-view", v); } catch {} render(); } }, l);
  const filters = el("div", { class: "filters" }, search,
    sel("segment", [["", "All segments"], ...Object.entries(SEG)]), sel("payment", [["", "Prepaid and postpaid"], ...Object.entries(PAY)]), sel("tech", [["", "4G and 5G"], ["5G", "5G"], ["4G", "4G"]]),
    sel("life", [["live", "Active and drafts"], ["active", "Active"], ["draft", "Drafts"], ["retired", "Retired"], ["all", "Everything"]]),
    el("span", { style: "margin-left:auto;display:flex;gap:6px" }, vbtn("cards", "Cards"), vbtn("table", "Table")));
  let body;
  if (!list.length) body = el("div", { class: "empty" }, "No offerings match these filters.");
  else if (view === "table") body = card(null, table(["Offering", "Segment", "Payment", "Tech", "Data", "Price", "Subscribers", "Status"], list.map((o) => el("tr", { class: "click", onclick: () => (location.hash = `#/offer/${o.id}`) },
    td([el("b", {}, o.name), el("div", { class: "muted" }, o.id)]), td(SEG[o.segment]), td(PAY[o.payment]), td(o.technology), td(o.data), td(o.price ? eur(o.price) : "—", "num"), td(num(o.subscribers), "num"), td([life(o), " ", o.lifecycle === "draft" ? badge(o.verdict, VERD[o.verdict]) : null]))), [5, 6]));
  else {
    const groups = new Map();
    for (const o of list) { const k = `${SEG[o.segment]} · ${PAY[o.payment]}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(o); }
    body = el("div", {}, [...groups].map(([k, os]) => el("div", { class: "group" }, el("h3", {}, k, el("span", { class: "muted" }, `${os.length}`)), el("div", { class: "grid" }, os.sort((a, b) => (a.price_cents ?? 0) - (b.price_cents ?? 0)).map(offerCard)))));
  }
  root.replaceChildren(kpis(), filters, body);
}

function offerPage(id) {
  setNav("offers"); titleEl.textContent = "Offering";
  const o = data.offers.find((x) => x.id === id);
  if (!o) return root.replaceChildren(el("div", { class: "empty" }, `No offering ${id}.`));
  const compat = data.addons.filter((a) => (a.technology === "any" || a.technology === o.technology) && (a.payment === "any" || a.payment === o.payment) && (a.segment === "any" || a.segment === o.segment || (a.segment === "consumer" && o.segment === "youth")));
  const fnd = o.findings.length ? o.findings.map((x) => el("div", { class: "find" }, badge(x.severity, VERD[x.severity]), el("div", {}, el("b", {}, `${x.check} · ${x.field}`), el("div", {}, x.issue), el("div", { class: "muted" }, `Fix: ${x.fix}`)))) : [el("p", { class: "muted" }, "All catalogue checks pass.")];
  const scan = data.scans.at(-1);
  root.replaceChildren(
    el("p", {}, el("a", { class: "lnk", href: "#/offers" }, "← Offerings")),
    el("div", { class: "card", style: "margin-bottom:12px" },
      el("div", { style: "display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap" },

async function render() {
  const { parts, q } = route();
  try {
    if (!data) await load();
    counts();
    if (parts[0] === "offer" && parts[1]) offerPage(parts[1]);
    else if (parts[0] === "drafts") draftsPage();
    else if (parts[0] === "addons") addonsPage();
    else if (parts[0] === "scans") scansPage();
    else if (parts[0] === "releases") releasesPage();
    else offersPage(q);
  } catch (e) { root.replaceChildren(el("div", { class: "empty" }, "Could not load the catalogue: " + e.message)); }
}

const t = document.getElementById("theme"), tl = document.getElementById("theme-label");
const sync = () => { tl.textContent = document.documentElement.classList.contains("dark") ? "Light mode" : "Dark mode"; }; sync();
t.addEventListener("click", () => { const d = !document.documentElement.classList.contains("dark"); document.documentElement.classList.toggle("dark", d); document.documentElement.style.colorScheme = d ? "dark" : "light"; try { localStorage.setItem("theme", d ? "dark" : "light"); } catch {} sync(); });
try { const o = await (await fetch("/data/ontology.json")).json(); document.getElementById("opname").textContent = o.operator ?? "ATLAS AI Labs"; } catch {}
window.addEventListener("hashchange", () => { fresh.clear(); render(); });
await render();
// Live: agents write drafts, scans and release tickets through the MCP door; re-render only when something changed and the user is not typing.
setInterval(async () => { try { if (await load() && document.activeElement?.tagName !== "INPUT" && document.activeElement?.tagName !== "SELECT") render(); } catch {} }, 5000);
