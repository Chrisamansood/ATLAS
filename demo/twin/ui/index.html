<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171717">
<title>ATLAS Twin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23171717'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='%2336E0AD' stroke-width='6'/%3E%3C/svg%3E">
<script>
// Same theme logic as the ATLAS Agent Organization: stored choice, else the system setting, default dark.
(function () { var t = null; try { t = localStorage.getItem("theme"); } catch (e) {}
  var dark = t === "dark" || (t !== "light" && !(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches));
  document.documentElement.classList.toggle("dark", dark); document.documentElement.style.colorScheme = dark ? "dark" : "light"; })();
</script>
<style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap");
:root {
  --font-sans: "Montserrat", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --radius: 0.5rem;
  --background: oklch(1 0 0); --foreground: oklch(0.145 0 0); --card: oklch(1 0 0); --muted: oklch(0.97 0 0); --muted-foreground: oklch(0.556 0 0);
  --border: oklch(0.922 0 0); --input: oklch(0.922 0 0); --primary: rgb(0, 35, 75); --ring: rgb(0, 160, 227);
  --sidebar: #f2f2f2; --sel: rgb(11, 58, 107);
  --ok: #2FA67A; --bad: #E0648A; --warn: #F0A030; --info: #2E86D6;
}
html.dark { --background: oklch(0.205 0 0); --foreground: oklch(0.985 0 0); --card: oklch(0.205 0 0); --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
  --border: oklch(1 0 0 / 0.1); --input: oklch(1 0 0 / 0.15); --primary: rgb(0, 160, 227); --sidebar: oklch(0.269 0 0); }
* { box-sizing: border-box; } html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); font-size: 14px; background: var(--background); color: var(--foreground); }
.app { display: flex; height: 100vh; }
.sb { width: 240px; flex: none; background: var(--sidebar); display: flex; flex-direction: column; padding: 12px; gap: 4px; overflow: auto; }
.sb-head { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; } .sb-head svg { width: 26px; height: 26px; flex: none; }
.sb-head b { font-size: 14px; font-weight: 600; display: block; line-height: 1.2; } .sb-head span { font-size: 11px; color: var(--muted-foreground); }
.sb-label { font-size: 10px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: color-mix(in oklab, var(--muted-foreground) 60%, transparent); padding: 14px 8px 4px; }
.nav { display: flex; align-items: center; gap: 10px; width: 100%; height: 32px; padding: 6px 8px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; color: inherit; text-decoration: none; background: none; border: 0; cursor: pointer; text-align: left; }
.nav:hover { background: color-mix(in oklab, currentColor 8%, transparent); } .nav[aria-current] { background: var(--sel); color: #fff; }
.nav svg { width: 16px; height: 16px; flex: none; } .sb-foot { margin-top: auto; padding-top: 10px; }
.mainc { flex: 1; min-width: 0; overflow: auto; }
.topbar { height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 24px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--background); z-index: 2; }
.topbar h1 { margin: 0; font-size: 14px; font-weight: 500; letter-spacing: .6px; text-transform: uppercase; }
.topbar .sub { color: var(--muted-foreground); font-size: 12px; margin-left: auto; }
.wrap { padding: 18px 24px 40px; max-width: 1180px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.chip { font: inherit; font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: inherit; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--sel); color: #fff; border-color: transparent; } .chip:focus-visible, select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--ring); outline-offset: 1px; }
select, input[type=number] { font: inherit; font-size: 12px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--input); background: transparent; color: inherit; }
.banner { border: 1px solid color-mix(in oklab, var(--warn) 50%, transparent); background: color-mix(in oklab, var(--warn) 10%, transparent); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; line-height: 1.5; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 14px; }
.card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; background: var(--card); }
.kpi .l { font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted-foreground); } .kpi .v { font-size: 26px; font-weight: 600; margin-top: 6px; } .kpi .n { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; line-height: 1.4; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 14px; } @media (max-width: 980px) { .grid2 { grid-template-columns: 1fr; } .sb { display: none; } }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; letter-spacing: .3px; } h3 { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted-foreground); margin: 14px 0 6px; font-weight: 500; }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; } .pill.go { background: color-mix(in oklab, var(--ok) 22%, transparent); color: var(--ok); } .pill.nogo { background: color-mix(in oklab, var(--bad) 20%, transparent); color: var(--bad); }
ul.reasons { margin: 8px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.55; } .muted { color: var(--muted-foreground); font-size: 12px; line-height: 1.5; }
svg text { font-family: var(--font-sans); fill: var(--muted-foreground); font-size: 10px; }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; } .btn { font: inherit; font-size: 12px; font-weight: 500; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--input); background: transparent; color: inherit; cursor: pointer; } .btn.primary { background: var(--sel); color: #fff; border-color: transparent; }
.counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; } .counters div { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; } .counters b { display: block; font-size: 20px; font-weight: 600; } .counters span { font-size: 11px; color: var(--muted-foreground); }
.bar { height: 6px; border-radius: 3px; background: var(--muted); overflow: hidden; margin-bottom: 8px; } .bar i { display: block; height: 100%; background: var(--ring); width: 0; }
.feed { font-size: 12px; line-height: 1.45; min-height: 190px; } .feed .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 6px 0; border-top: 1px solid var(--border); } .feed .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { align-self: center; font-size: 10.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; } .tag.c { background: color-mix(in oklab, var(--ok) 22%, transparent); color: var(--ok); } .tag.w { background: color-mix(in oklab, var(--bad) 22%, transparent); color: var(--bad); } .tag.l { background: color-mix(in oklab, var(--warn) 24%, transparent); color: var(--warn); }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; } th, td { text-align: left; padding: 7px 8px; border-top: 1px solid var(--border); } th { font-size: 11px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-foreground); font-weight: 500; border-top: 0; } td.num { font-variant-numeric: tabular-nums; }
.empty { border: 1px dashed var(--border); border-radius: var(--radius); padding: 28px; line-height: 1.7; } code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: var(--muted); padding: 1px 6px; border-radius: 5px; }
input[type=range] { width: 160px; accent-color: var(--ring); }

.seg { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.fld { display:flex; flex-direction:column; gap:4px; font-size:12px; color: var(--muted-foreground); } .fld input[type=number] { width: 150px; }
.cols { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-bottom:14px; } @media (max-width: 980px) { .cols { grid-template-columns: 1fr; } }
.verdict { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.8px; padding:4px 12px; border-radius:999px; }
.verdict.ok { background: color-mix(in oklab, var(--ok) 22%, transparent); color: var(--ok); } .verdict.no { background: color-mix(in oklab, var(--bad) 22%, transparent); color: var(--bad); }
.m { display:grid; grid-template-columns: 1fr auto; gap:4px 10px; font-size:13px; margin:10px 0; } .m b { font-weight:600; text-align:right; }
.chk { font-size:12.5px; display:grid; grid-template-columns: 18px 1fr auto; gap:6px; padding:5px 0; border-top:1px solid var(--border); } .chk .y { color: var(--ok); } .chk .n { color: var(--bad); }
.num { text-align:right; font-variant-numeric: tabular-nums; }
.bill td { padding:4px 8px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sb">
    <div class="sb-head">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="13" fill="#171717"/><circle cx="32" cy="32" r="13" fill="none" stroke="#36E0AD" stroke-width="6"/></svg>
      <div><b>Twin</b><span id="opname">ATLAS AI Labs</span></div>
    </div>
    <div class="sb-label">View</div>
    <a class="nav" aria-current="page" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>Replay lab</a>
    <div id="atlas-platform" data-current="twin"></div>
    <div class="sb-label">Twin APIs</div>
    <a class="nav" href="/twin/live#apis">API desk</a>
    <div class="sb-foot"><button class="nav" id="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span id="theme-label">Light mode</span></button></div>
  </aside>
  <div class="mainc">
    <div class="topbar"><h1>BSS twin: prove it before it goes live</h1><span class="sub" id="gen"></span></div>
    <div class="wrap" id="root"><p class="muted">Loading…</p></div>
  </div>
</div>
<script type="module">
const el = (tag, attrs = {}, ...kids) => { const n = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v); } for (const c of kids.flat(Infinity)) if (c != null) n.append(c.nodeType ? c : document.createTextNode(String(c))); return n; };
const eur = (c) => (c < 0 ? "-" : "") + "EUR " + (Math.abs(c) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num = (x) => Math.round(x).toLocaleString("en-US");
const root = document.getElementById("root");
let W, agent = "bill-shock", gate = true, last = null;
const P = { cap: "", share: "50", maxd: "", prop: "10" };

async function boot() {
  W = await (await fetch("/twin/api/world", { cache: "no-store" })).json();
  try { const o = await (await fetch("/data/ontology.json", { cache: "no-store" })).json(); document.getElementById("opname").textContent = o.operator ?? "ATLAS AI Labs"; } catch {}
  document.getElementById("gen").textContent = `seed ${W.seed} · ${num(W.subscribers)} invented customers`;
  render();
}

function kpi(l, v, n) { return el("div", { class: "card kpi" }, el("div", { class: "l" }, l), el("div", { class: "v" }, v), el("div", { class: "n" }, n)); }

function render() {
  root.replaceChildren(
    el("div", { class: "kpis" }, kpi("Customers", num(W.subscribers), "invented, seeded"), kpi("Bills rated", num(W.bills), "12 months each, exact"), kpi("Catalogue offers", num(W.offers), "TM Forum 620 shape"), kpi("Bill-shock cases", num(W.shock), "latest month, roaming spike"), kpi("Churn-risk customers", num(W.risky), "risk 0.5 or more")),
    controls(),
    el("div", { id: "result" }, last ? result(last) : el("div", { class: "empty" }, "Pick an agent, change a rule if you like, then press ", el("b", {}, "Replay on 10,000 customers"), ". The twin runs the agent on a copy and shows what would happen. Nothing real is touched.")),
    lookup()
  );
}

function num_(id, label, key, ph) { return el("label", { class: "fld" }, label, el("input", { type: "number", id, value: P[key], placeholder: ph, min: "0", step: "1", oninput: (e) => { P[key] = e.target.value; } })); }
function chip(label, pressed, fn) { return el("button", { class: "chip", "aria-pressed": String(pressed), onclick: fn }, label); }

function controls() {
  const bs = agent === "bill-shock";
  const knobs = bs
    ? [num_("cap", "Raise every credit cap to at least (EUR)", "cap", "blank = today's table"), num_("share", "Agent proposes this share of the surprise (%)", "share", "50")]
    : [num_("maxd", "Maximum discount allowed (%)", "maxd", "blank = today's 15"), num_("prop", "Agent proposes a discount of (%)", "prop", "10")];
  const presets = bs
    ? [["Raise cap to EUR 35", () => { P.cap = "35"; P.share = "50"; gate = true; }], ["Raise cap to EUR 45", () => { P.cap = "45"; P.share = "50"; gate = true; }], ["Take the gate away", () => { P.cap = ""; P.share = "100"; gate = false; }]]
    : [["Offer 15%", () => { P.maxd = ""; P.prop = "15"; gate = true; }], ["Allow up to 20%", () => { P.maxd = "20"; P.prop = "20"; gate = true; }], ["Take the gate away", () => { P.maxd = ""; P.prop = "20"; gate = false; }]];
  return el("div", { class: "card", style: "margin-bottom:14px" },
    el("h2", {}, "1. Choose an agent and a rule change"),
    el("div", { class: "seg", style: "margin-bottom:12px" }, chip("Bill Shock agent", bs, () => { agent = "bill-shock"; last = null; render(); }), chip("Retention agent", !bs, () => { agent = "retention"; last = null; render(); }),
      el("span", { class: "muted" }, bs ? "Explains a surprise bill and proposes a goodwill credit." : "Offers a loyalty discount to customers likely to leave.")),
    el("div", { class: "seg", style: "gap:16px; align-items:flex-end; margin-bottom:12px" }, ...knobs,
      el("div", { class: "fld" }, "Rule gate between agent and customer", el("div", { class: "seg" }, chip("On", gate, () => { gate = true; render(); }), chip("Off", !gate, () => { gate = false; render(); })))),
    el("div", { class: "seg" }, el("button", { class: "btn", onclick: replay }, "Replay on 10,000 customers"), el("span", { class: "muted" }, "or try:"), ...presets.map(([t, f]) => el("button", { class: "chip", onclick: () => { f(); render(); replay(); } }, t))));
}

async function replay() {
  const q = new URLSearchParams({ agent, gate: String(gate) });
  if (agent === "bill-shock") { if (P.cap) q.set("cap_override", `${P.cap}.00`); if (P.share) q.set("proposal_share", P.share); }
  else { if (P.maxd) q.set("max_discount_percent", P.maxd); if (P.prop) q.set("proposal_percent", P.prop); }
  const t0 = performance.now();
  document.getElementById("result").replaceChildren(el("p", { class: "muted" }, "Replaying…"));
  last = await (await fetch(`/twin/api/replay?${q}`)).json();
  last.ms = Math.round(performance.now() - t0);
  document.getElementById("result").replaceChildren(result(last));
}

function side(title, s) {
  const m = s.metrics, bs = last.agent === "bill-shock";
  const rows = bs
    ? [["Customers with a surprise bill", num(m.population)], ["Credits granted", num(m.granted)], ["Sent to a person for approval", num(m.queued_for_approval + m.handed_to_human)], ["Refused (identity not verified)", num(m.refused)], ["Total credit paid", eur(m.paid_cents)], ["Credits outside the mandate", num(m.violations)]]
    : [["Customers likely to leave", num(m.population)], ["Offers released", num(m.released)], ["Sent to a person for approval", num(m.queued_for_approval)], ["Customers kept (simulated)", num(m.saved)], ["Revenue kept, 12 months", eur(m.revenue_kept_cents)], ["Discount given, 12 months", eur(m.discount_cost_cents)], ["Offers outside the mandate", num(m.violations)]];
  const c = s.certificate;
  return el("div", { class: "card" }, el("h2", {}, title), el("span", { class: `verdict ${c.verdict === "CERTIFIED" ? "ok" : "no"}` }, c.verdict === "CERTIFIED" ? "PASS: synthetic rehearsal checks" : "REJECTED: stays in rehearsal"),
    el("div", { class: "m" }, rows.flatMap(([a, b]) => [el("span", {}, a), el("b", {}, b)])),
    el("h3", {}, "Rehearsal checks"), c.checks.map((k) => el("div", { class: "chk" }, el("span", { class: k.ok ? "y" : "n" }, k.ok ? "✓" : "✗"), el("span", {}, k.name), el("span", { class: "muted" }, `${k.value} (${k.limit})`))));
}

function result(r) {
  const bs = r.agent === "bill-shock";
  const rej = r.candidate.certificate.verdict !== "CERTIFIED";
  const why = r.candidate.certificate.checks.filter((c) => !c.ok).map((c) => c.name.toLowerCase());
  return el("div", {},
    el("h2", {}, "2. What would happen"),
    el("p", { class: "muted", style: "margin:0 0 10px" }, `Replayed on ${num(W.subscribers)} customers in ${r.ms} ms. Baseline uses the seeded policy with the gate on. This is a synthetic rehearsal, not a production certification.`),
    el("div", { class: "cols" }, side("Today's rules", r.baseline), side("Proposed rules", r.candidate)),
    el("div", { class: "card", style: "margin-bottom:14px" }, el("h2", {}, rej ? "Verdict: do not release this change" : "Verdict: candidate passes this rehearsal"),
      el("p", { style: "margin:0" }, rej ? `The proposed rules fail: ${why.join("; ")}.` : "The proposed rules pass every check on this population.")),
    el("div", { class: "card" }, el("h2", {}, `3. Biggest differences, bill by bill (${num(r.changed_total)} customers differ)`),
      r.changes.length ? el("table", {}, el("thead", {}, el("tr", {}, ...["Customer", "Segment", bs ? "Bill before" : "Price before", "Under today's rules", "Under proposed rules", "Proposed decision"].map((h, i) => el("th", { class: i > 1 && i < 5 ? "num" : "" }, h)))),
        el("tbody", {}, r.changes.map((c) => el("tr", {}, el("td", {}, el("a", { href: "#", onclick: (e) => { e.preventDefault(); document.getElementById("cid").value = c.id; show(c.id); } }, c.id), " ", c.name, " ", el("a", { href: `/twin/office#/customer/${c.id}/bills`, target: "_blank", title: "Open in the back office" }, "↗")), el("td", {}, c.segment), el("td", { class: "num" }, eur(c.before_cents)), el("td", { class: "num" }, eur(c.baseline_after_cents)), el("td", { class: "num" }, eur(c.candidate_after_cents)), el("td", {}, `${c.candidate_decision} (${c.clause})`))))) : el("p", { class: "muted" }, "No customer differs between the two rule sets.")));
}

function lookup() {
  return el("div", { class: "card", style: "margin-top:14px" }, el("h2", {}, "4. Look at one customer through the twin's billing API"),
    el("div", { class: "seg" }, el("input", { id: "cid", placeholder: "NW-100123", value: "NW-100000", style: "height:30px;border-radius:8px;border:1px solid var(--input);background:transparent;color:inherit;padding:0 8px;font:inherit" }), el("button", { class: "btn", onclick: () => show(document.getElementById("cid").value.trim()) }, "Show latest bill"), el("span", { class: "muted" }, "Reads TM Forum 629 and 678, the same calls an agent makes.")),
    el("div", { id: "bill", style: "margin-top:10px" }));
}
async function show(id) {
  const box = document.getElementById("bill");
  const cu = await fetch(`/twin/tmf/629/customer/${encodeURIComponent(id)}`); if (!cu.ok) { box.replaceChildren(el("p", { class: "muted" }, "No such customer.")); return; }
  const c = await cu.json(); const bills = await (await fetch(`/twin/tmf/678/customerBill?relatedParty.id=${encodeURIComponent(id)}`)).json(); const b = bills[bills.length - 1];
  const seg = c.characteristic.find((x) => x.name === "segment").value;
  box.replaceChildren(el("p", { style: "margin:0 0 6px" }, el("b", {}, c.name), ` · ${seg} · bill ${b.id} · amount due `, el("b", {}, `EUR ${b.amountDue.value}`)),
    el("table", { class: "bill" }, el("tbody", {}, b.appliedCharge.map((l) => el("tr", {}, el("td", {}, l.description), el("td", { class: "num" }, `EUR ${l.taxIncludedAmount.value}`))))));
}

const t = document.getElementById("theme"), tl = document.getElementById("theme-label");
const sync = () => { tl.textContent = document.documentElement.classList.contains("dark") ? "Light mode" : "Dark mode"; }; sync();
t.addEventListener("click", () => { const d = !document.documentElement.classList.contains("dark"); document.documentElement.classList.toggle("dark", d); document.documentElement.style.colorScheme = d ? "dark" : "light"; try { localStorage.setItem("theme", d ? "dark" : "light"); } catch {} sync(); });
boot();
</script>
<script src="/shared/platform-nav.js"></script>
